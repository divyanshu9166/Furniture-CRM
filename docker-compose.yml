services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-furniturecrm}
    command: >
      postgres
        -c shared_buffers=256MB
        -c effective_cache_size=768MB
        -c work_mem=16MB
        -c maintenance_work_mem=64MB
        -c max_connections=100
        -c random_page_cost=1.1
        -c effective_io_concurrency=200
        -c wal_compression=on
    # Map port for local dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    # appendonly yes: persist queue data to disk so BullMQ jobs survive
    # a container restart. The volume below keeps the dump across deploys.
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Run migrations on start (exits after completion)
  migrate:
    build:
      context: .
      target: builder
    command: >
      sh -c "npx prisma migrate deploy --schema ./prisma/schema.prisma"
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-furniturecrm}"
    depends_on:
      db:
        condition: service_healthy

  app:
    build: .
    restart: always
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-furniturecrm}"
      NEXTAUTH_SECRET: "${NEXTAUTH_SECRET}"
      NEXTAUTH_URL: "${NEXTAUTH_URL}"
      SESSION_SECRET: "${SESSION_SECRET}"
      NEXT_PUBLIC_APP_URL: "https://${DOMAIN:-my-crm-project.duckdns.org}"
      CRM_API_SECRET: "${CRM_API_SECRET}"
      GEMINI_API_KEY: "${GEMINI_API_KEY}"
      ENCRYPTION_KEY: "${ENCRYPTION_KEY}"
      REDIS_URL: "redis://redis:6379"
      # Socket.io gateway URL — consumed by socket.io-client in the browser
      NEXT_PUBLIC_WS_URL: "https://${DOMAIN:-my-crm-project.duckdns.org}:3001"
      # Images stored on VPS local volume — no cloud storage needed
      UPLOAD_DIR: "/app/uploads"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/auth/me"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Lightweight WebSocket gateway: subscribes to Redis Pub/Sub and
  # pushes events to authenticated browser clients via socket.io.
  ws-server:
    build:
      context: ./ws-server
      dockerfile: Dockerfile
    restart: always
    ports:
      - "3001:3001"
    environment:
      PORT: "3001"
      REDIS_URL: "redis://redis:6379"
      SESSION_SECRET: "${SESSION_SECRET}"
      # Allowlist the CRM origin so socket.io CORS doesn't block connections.
      CORS_ORIGIN: "https://${DOMAIN:-my-crm-project.duckdns.org}"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  pgdata:
  redisdata:
  uploads:
